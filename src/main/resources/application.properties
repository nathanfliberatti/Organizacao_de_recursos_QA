# Segredo do JWT (HS256, minimo de 32 bytes): defina JWT_SECRET. Sem ele, uma chave aleatoria e gerada a cada execucao.
app.security.jwt-secret=${JWT_SECRET:}
app.security.token-lifetime-seconds=28800
# Usuarios/recursos de demonstracao. Desligado por padrao. Senha: APP_DEMO_PASSWORD ou, se vazia, aleatoria (no log).
app.demo-data.enabled=${APP_DEMO_DATA:false}
app.demo-data.password=${APP_DEMO_PASSWORD:}

# Sem o perfil "postgres" a aplicacao usa armazenamento em memoria (somente desenvolvimento/demonstracao):
# nao configura DataSource. Os perfis "postgres" e "perf" reativam a auto-configuracao do banco.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration,\
  org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration

# Webhook opcional de notificacoes (RF-11). Vazio = entrega simulada (somente registro no banco).
app.notifications.webhook-url=${NOTIFICATION_WEBHOOK_URL:}
